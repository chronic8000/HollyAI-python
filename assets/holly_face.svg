<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Holly's face base -->
  <defs>
    <radialGradient id="faceGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#F0E6D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C0A8;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8A080;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Face outline -->
  <circle cx="200" cy="200" r="180" fill="url(#faceGradient)" stroke="#8B7355" stroke-width="4"/>
  
  <!-- Face shadow -->
  <ellipse cx="220" cy="220" rx="160" ry="140" fill="url(#shadowGradient)" opacity="0.3"/>
  
  <!-- Eyes -->
  <!-- Left eye socket -->
  <ellipse cx="160" cy="160" rx="25" ry="20" fill="#E8DCC6" stroke="#8B7355" stroke-width="2"/>
  <!-- Right eye socket -->
  <ellipse cx="240" cy="160" rx="25" ry="20" fill="#E8DCC6" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Left eye white -->
  <ellipse cx="160" cy="160" rx="18" ry="15" fill="#FFFFFF"/>
  <!-- Right eye white -->
  <ellipse cx="240" cy="160" rx="18" ry="15" fill="#FFFFFF"/>
  
  <!-- Left pupil -->
  <circle cx="160" cy="160" r="8" fill="#2C3E50"/>
  <!-- Right pupil -->
  <circle cx="240" cy="160" r="8" fill="#2C3E50"/>
  
  <!-- Eye reflections -->
  <circle cx="165" cy="155" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="245" cy="155" r="3" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Eyebrows -->
  <path d="M 140 135 Q 160 125 180 135" stroke="#8B7355" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 220 135 Q 240 125 260 135" stroke="#8B7355" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="190" rx="8" ry="12" fill="#D4C0A8" stroke="#B8A080" stroke-width="1"/>
  
  <!-- Mouth -->
  <ellipse cx="200" cy="240" rx="25" ry="8" fill="#FFFFFF" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Mouth line when closed -->
  <line x1="180" y1="240" x2="220" y2="240" stroke="#8B7355" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Facial contours -->
  <path d="M 120 180 Q 140 200 120 220" stroke="#B8A080" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 280 180 Q 260 200 280 220" stroke="#B8A080" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Computer interface elements around head -->
  <g stroke="#3498DB" stroke-width="2" fill="none" opacity="0.7">
    <!-- Corner brackets -->
    <path d="M 50 50 L 50 80 L 80 80"/>
    <path d="M 350 50 L 350 80 L 320 80"/>
    <path d="M 50 350 L 50 320 L 80 320"/>
    <path d="M 350 350 L 350 320 L 320 320"/>
    
    <!-- Status indicators -->
    <circle cx="60" cy="200" r="5" fill="#27AE60"/>
    <circle cx="340" cy="200" r="5" fill="#E74C3C"/>
    
    <!-- Data lines -->
    <line x1="40" y1="200" x2="360" y2="200" opacity="0.3"/>
    <line x1="200" y1="40" x2="200" y2="360" opacity="0.3"/>
  </g>
  
  <!-- Holly's characteristic computer grid overlay -->
  <g stroke="#3498DB" stroke-width="1" fill="none" opacity="0.2">
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3498DB" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>
</svg>
